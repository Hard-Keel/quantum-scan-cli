# Publishes @hardkeel/quantum-scan to npm when a version tag (v1.2.3) is pushed.
# No npm token: npm trusts this workflow through GitHub's OpenID Connect (trusted publishing),
# and adds a provenance statement that links the package to this repository and commit.
# One-time setup on npmjs.com: package settings, Trusted Publisher, GitHub Actions,
# organization Hard-Keel, repository quantum-scan-cli, workflow release.yml, environment npm.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package version
        run: |
          v="$(node -p 'require("./package.json").version')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; fi
          if npm view "@hardkeel/quantum-scan@$v" version >/dev/null 2>&1; then echo "$v is already on npm"; exit 1; fi
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - run: npm publish --access public
